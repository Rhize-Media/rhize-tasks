name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**', '.wolf/**', 'STATE.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.claude/**', '.wolf/**', 'STATE.md']
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: caller-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml
