name: Node CI
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/ci/config.json
      helper-directory:
        type: string
        default: .github/ci
permissions:
  contents: read
  deployments: read
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate configuration and managed files
        id: config
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
        run: node "$HELPERS/run.mjs" configure "$CONFIG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.config.outputs.node }}
      - name: Install pinned package manager
        id: bootstrap
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
        run: node "$HELPERS/run.mjs" bootstrap "$CONFIG"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.bootstrap.outputs.cache }}
          key: node-${{ runner.os }}-${{ steps.config.outputs.node }}-${{ steps.config.outputs.manager }}-${{ steps.config.outputs.version }}-${{ steps.config.outputs.lockfile }}-${{ github.event_name }}-${{ hashFiles(steps.config.outputs.lockfile) }}
      - name: Frozen install
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
        run: node "$HELPERS/run.mjs" install "$CONFIG"
      - name: Docs, typecheck, lint, tests and build
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
        run: node "$HELPERS/run.mjs" run "$CONFIG"
      - name: Read-only exact preview smoke (when configured)
        timeout-minutes: 5
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node "$HELPERS/preview.mjs" "$CONFIG"
      - name: Remove this run's disposable database
        if: always()
        env:
          CONFIG: ${{ inputs.config }}
          HELPERS: ${{ inputs.helper-directory }}
        run: node "$HELPERS/run.mjs" cleanup "$CONFIG"
